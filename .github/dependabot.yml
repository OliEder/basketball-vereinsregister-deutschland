version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # TypeScript-Hauptversionen nur bewusst heben: ts-node und ts-jest laufen über @typescript/typescript6, die Typprüfung über TypeScript 7 (siehe README, Abschnitt TypeScript).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
