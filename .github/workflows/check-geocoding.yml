name: Check Geocoding

# Einmalige/manuelle Kontrolle aller Vereinskoordinaten per Namenssuche.
# Verändert keine Daten; Bericht als Artifact "geocoding-check" und auf dem Branch "geocoding-report" (~45 min).
on:
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Abweichung in km, ab der ein Verein als Abweichung gilt'
        default: '5'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Koordinaten per Namenssuche kontrollieren
        run: npm run check-geocoding -- --threshold=${{ inputs.threshold }}

      # Bericht zusätzlich auf den Branch "geocoding-report" legen (lesbar ohne Artifact-Download).
      - name: Bericht auf Branch geocoding-report veröffentlichen
        if: ${{ always() && hashFiles('geocoding-check.json') != '' }}
        run: |
          cp geocoding-check.json "$RUNNER_TEMP/geocoding-check.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan geocoding-report
          git rm -rfq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/geocoding-check.json" geocoding-check.json
          git add geocoding-check.json
          git commit -qm "report: geocoding check"
          git push -f origin geocoding-report

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: geocoding-check
          path: geocoding-check.json
