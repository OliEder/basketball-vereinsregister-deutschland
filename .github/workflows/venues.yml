name: Spielorte (matchInfo)

# Holt die Halle je Spiel aus match/id/{id}/matchInfo und legt sie dauerhaft im Branch "data-store" ab.
# Pro Lauf gilt ein Zeitbudget; die Warteschlange (crawler/venues.ts) holt zuerst die Spiele der nächsten
# 14 Tage, dann alle weiteren kommenden und zuletzt die gespielten. Läuft alle 6 Stunden und manuell.
on:
  schedule:
    - cron: '47 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Zeitbudget in Minuten'
        default: '25'
      max:
        description: 'Höchstzahl Abrufe (0 = nur Zeitbudget)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: venues
  cancel-in-progress: false

jobs:
  venues:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # Zeitbudget (Eingabe) plus Einrichtung und Sichern; ein Abbruch durch das Timeout würde auch das Sichern verhindern
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Datenbranch holen; gibt es ihn noch nicht, beginnt der Lauf mit einem leeren Speicher.
      - name: Branch data-store holen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data-store >/dev/null 2>&1; then
            git fetch --depth=1 origin data-store
            git worktree add data-store FETCH_HEAD
            echo "exists=true" >> "$GITHUB_ENV"
          else
            mkdir data-store
            echo "exists=false" >> "$GITHUB_ENV"
          fi

      - name: Spielorte holen
        run: npm run venues -- --store=data-store --budget-min=${{ inputs.budget || '25' }} --max=${{ inputs.max || '0' }}

      # Auch nach einem Abbruch wegen Fehlern wird gesichert, was bis dahin geholt wurde.
      - name: In data-store veröffentlichen
        if: ${{ always() && hashFiles('data-store/venues.json') != '' }}
        run: |
          cp -r data-store "$RUNNER_TEMP/data-store-out"
          rm -rf "$RUNNER_TEMP/data-store-out/.git"
          git worktree remove --force data-store 2>/dev/null || true
          rm -rf data-store
          git checkout --orphan data-store-new
          git rm -rfq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/data-store-out/." .
          git add -A
          git commit -qm "data: Spielorte $(date -u +%F\ %H:%M)"
          # Der Verlauf bleibt klein: jeder Lauf ersetzt den Branch durch genau einen Commit.
          git push -f origin data-store-new:data-store
