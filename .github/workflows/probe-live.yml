name: Probe Live Crawl

# Misst Dauer, Antwortgröße und Drosselung der BBB-API für einen Live-Crawl pro Liga.
# Verändert keine Daten; Ergebnis im Lauf-Log und als Artifact "probe-live".
on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Anzahl der Ligen in der Stichprobe'
        default: '40'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Probe
        run: npm run probe-live -- --sample=${{ inputs.sample }}

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: probe-live
          path: probe-live.json
