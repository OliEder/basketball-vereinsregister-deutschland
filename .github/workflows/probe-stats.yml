name: Probe Stats

# Prüft, welche Teamstatistik-Felder je Liga befüllt sind (Bundesligen, Regionalliga, Jugend).
# Verändert keine Daten, liest keine Spielerwerte. Ergebnis: Branch "probe-stats-report".
on:
  workflow_dispatch:
    inputs:
      ligen:
        description: 'Liga-IDs, kommagetrennt (leer = Standardauswahl)'
        default: ''

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Probe
        run: npm run probe-stats -- ${{ inputs.ligen && format('--ligen={0}', inputs.ligen) || '' }}

      - name: Bericht auf Branch probe-stats-report veröffentlichen
        if: ${{ always() && hashFiles('probe-stats.json') != '' }}
        run: |
          cp probe-stats.json "$RUNNER_TEMP/probe-stats.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-stats-report
          git rm -rfq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/probe-stats.json" probe-stats.json
          git add probe-stats.json
          git commit -qm "report: probe-stats"
          git push -f origin probe-stats-report

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: probe-stats
          path: probe-stats.json
