name: Probe Seasons

# Sondiert die Liga-ID-Systematik (ID-Blöcke je Saison) und prüft die Beispiel-IDs der
# API-Beschreibung. Verändert keine Daten. Ergebnis: Branch "probe-seasons-report".
on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Größte Liga-ID der Stichprobe'
        default: '57000'
      step:
        description: 'Abstand der abgetasteten IDs'
        default: '250'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Probe
        run: npm run probe-seasons -- --max=${{ inputs.max }} --step=${{ inputs.step }}

      - name: Bericht auf Branch probe-seasons-report veröffentlichen
        if: ${{ always() && hashFiles('probe-seasons.json') != '' }}
        run: |
          cp probe-seasons.json "$RUNNER_TEMP/probe-seasons.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-seasons-report
          git rm -rfq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/probe-seasons.json" probe-seasons.json
          git add probe-seasons.json
          git commit -qm "report: probe-seasons"
          git push -f origin probe-seasons-report

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: probe-seasons
          path: probe-seasons.json
