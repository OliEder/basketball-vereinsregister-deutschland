name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'data/clubs.json'
      - 'data/schemas/**'
      - 'crawler/live.ts'
      - 'crawler/seo.ts'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 */6 * * *'   # alle 6 Stunden: Live-Daten (Tabellen, Spielpläne) neu crawlen
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      pages: write
      id-token: write
      contents: write   # Branch url-store: dauerhafte URL-Zuordnung der Vereinsseiten

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Abhängigkeiten immer installieren: auch ein reiner Portal-Deploy ohne Live-Crawl braucht ts-node
      - run: npm ci

      # Live-Daten des letzten erfolgreichen Laufs (damit Deploys bei Portal-Änderungen
      # die Live-Daten behalten, ohne neu zu crawlen).
      - name: Live-Daten aus dem Cache holen
        uses: actions/cache/restore@v6
        with:
          path: _live
          key: live-${{ github.run_id }}
          restore-keys: live-

      - name: Live-Crawl nötig?
        id: need
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ ! -f _live/index.json ]; then
            echo "crawl=true" >> "$GITHUB_OUTPUT"
          else
            echo "crawl=false" >> "$GITHUB_OUTPUT"
          fi

      # Fehlschlag (Guard in crawler/live.ts: zu viele Fehler) verhindert den Deploy nicht;
      # dann bleiben die zuletzt gecachten Live-Daten erhalten.
      - name: Live-Crawl (Tabellen und Spielpläne pro Liga)
        id: live
        if: steps.need.outputs.crawl == 'true'
        continue-on-error: true
        run: |
          npm run live -- --out=_live_new
          rm -rf _live
          mv _live_new _live

      - name: Live-Daten cachen
        if: steps.live.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: _live
          key: live-${{ github.run_id }}

      # Spielorte (Branch data-store, vom Workflow "Spielorte" gepflegt); fehlt der Branch, entfallen nur die Hallen
      - name: Spielorte holen
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: data-store
          path: data-store

      # Saison-Archiv (Branch season-archive): Tabellen und Ergebnisse dauerhaft sichern, die API liefert nur die laufende Saison.
      # Ein Fehler hier verhindert den Deploy nicht.
      - name: Saison archivieren
        id: archive
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin season-archive >/dev/null 2>&1; then
            git fetch --depth=1 origin season-archive
            git worktree add season-archive FETCH_HEAD
          else
            mkdir season-archive
          fi
          npm run archive -- --live=_live --store=season-archive

      # Veröffentlicht wird höchstens einmal täglich (erster Lauf nach Mitternacht UTC) oder auf Wunsch; der Branch
      # wird durch genau einen Commit ersetzt. Das Archiv entsteht in einem eigenen Verzeichnis, nicht im Arbeitsbaum.
      - name: Saison-Archiv sichern
        if: ${{ steps.archive.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'push' }}
        continue-on-error: true
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$HOUR" != "00" ] && [ "$HOUR" != "01" ]; then
            echo "Archiv wird erst im ersten Lauf nach Mitternacht veröffentlicht."
            exit 0
          fi
          OUT="$RUNNER_TEMP/season-archive-out"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp -r season-archive/. "$OUT/"
          rm -rf "$OUT/.git"
          cd "$OUT"
          git init -q -b season-archive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data: Saison-Archiv $(date -u +%F)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin season-archive

      # URL-Zuordnung der statischen Vereinsseiten (Branch url-store); fehlt der Branch, beginnt sie leer
      - name: URL-Zuordnung holen
        run: |
          if git ls-remote --exit-code --heads origin url-store >/dev/null 2>&1; then
            git fetch --depth=1 origin url-store
            git worktree add url-store FETCH_HEAD
          else
            mkdir url-store
          fi

      - name: Deploy-Artefakt zusammenstellen
        run: |
          mkdir -p _site/data/schemas
          cp portal/index.html portal/style.css portal/app.js portal/verein.html portal/verein.css portal/verein.js portal/theme.js portal/team.html portal/team.css portal/team.js portal/team-logic.js portal/seo.css portal/favorites.js portal/report.js portal/hall.js portal/pagenav.js portal/team-stats.js portal/map-tiles.js portal/hall-logic.js portal/hall-map.js portal/hall-list-map.js _site/
          cp -r portal/dss _site/dss
          npm run hall-index -- --out=_site/data/live/hall-index.json --coords=data-store/hall-coords.json
          cp data/clubs.json _site/data/clubs.json
          cp data/schemas/*.json _site/data/schemas/
          if [ -d _live ]; then
            mkdir -p _site/data/live
            cp -r _live/. _site/data/live/
          fi
          [ -d data-store ] && npm run apply-venues -- --dir=_site/data/live --store=data-store || true
          # Statische Seiten für Suchmaschinen (Vereine, Regionen, Sitemap, Weiterleitungen)
          npm run seo -- --site=_site --store=url-store --coords=data-store/hall-coords.json

      # Die Zuordnung wird nur bei Änderungen gesichert (nur auf main, nie aus Pull Requests)
      - name: URL-Zuordnung sichern
        if: github.ref == 'refs/heads/main'
        run: |
          cd url-store
          if [ ! -d .git ] && [ ! -f .git ]; then
            git init -q -b url-store
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet && git rev-parse HEAD >/dev/null 2>&1; then
            echo "URL-Zuordnung unverändert"
          else
            git commit -qm "data: URL-Zuordnung $(date -u +%F\ %H:%M)"
            git push origin HEAD:url-store
          fi

      # Kalender-Abo je Team (ics/<teamId>.ics) mit den Spielorten aus data-store; ein Fehler verhindert den Deploy nicht.
      # Inkrementell: Die Kalender des letzten Laufs und das Manifest (Hash je Team) kommen aus dem Cache; nur Teams mit geänderten
      # Eingaben werden neu gebaut. Der Cache wird einmal pro Tag gespeichert (gleicher Schlüssel wird nicht überschrieben),
      # damit er den Live-Daten-Cache nicht verdrängt; spätere Läufe des Tages bauen dann mehr um, bleiben aber richtig.
      - name: Tag für den Kalender-Cache
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Kalender aus dem Cache holen
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            _site/ics
            _ics-manifest.json
          key: ics-${{ steps.day.outputs.day }}
          restore-keys: ics-

      - name: Kalender erzeugen
        id: ics
        continue-on-error: true
        run: npm run ics -- --live=_site/data/live --out=_site/ics --team-urls=_site/data/team-url-map.json --manifest=_ics-manifest.json

      - name: Kalender cachen
        if: steps.ics.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            _site/ics
            _ics-manifest.json
          key: ics-${{ steps.day.outputs.day }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - uses: actions/deploy-pages@v5
        id: deployment

      - name: Live-Crawl-Fehler melden
        if: steps.live.outcome == 'failure'
        run: |
          echo "::error::Live-Crawl fehlgeschlagen — es wurden die zuletzt gecachten Live-Daten (falls vorhanden) deployt."
          exit 1
