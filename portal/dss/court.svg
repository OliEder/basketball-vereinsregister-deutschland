<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.2 -0.2 28.4 15.4" fill="none" stroke="#000" stroke-width="0.07" stroke-linejoin="round">
  <!-- FIBA-Spielfeld 28 × 15 m, Maße in Metern. Nur die Linien zählen (wird als Maske genutzt). -->
  <rect x="0" y="0" width="28" height="15"/>
  <line x1="14" y1="0" x2="14" y2="15"/>
  <circle cx="14" cy="7.5" r="1.8"/>
  <g id="half">
    <!-- Zone (Trapez der FIBA ist hier als Rechteck 4,9 × 5,8 m gezeichnet) -->
    <rect x="0" y="5.05" width="5.8" height="4.9"/>
    <!-- Freiwurfkreis: außen durchgezogen, innen gestrichelt -->
    <path d="M5.8 5.7 A1.8 1.8 0 0 1 5.8 9.3"/>
    <path d="M5.8 5.7 A1.8 1.8 0 0 0 5.8 9.3" stroke-dasharray="0.25 0.2"/>
    <!-- Korbbrett, Ring, Halbkreis unter dem Korb -->
    <line x1="1.2" y1="6.6" x2="1.2" y2="8.4"/>
    <circle cx="1.575" cy="7.5" r="0.225"/>
    <path d="M1.2 6.25 H1.575 A1.25 1.25 0 0 1 1.575 8.75 H1.2"/>
    <!-- Dreierlinie: Radius 6,75 m um den Korb, 0,9 m vor der Seitenlinie gerade -->
    <path d="M0 0.9 H2.99 A6.75 6.75 0 0 1 2.99 14.1 H0"/>
  </g>
  <use href="#half" transform="translate(28 0) scale(-1 1)"/>
</svg>
